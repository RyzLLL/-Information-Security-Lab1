name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Functional + attack-oriented test suite
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (functional + SQLi/XSS regressions)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Style / correctness lint (pinned, so it cannot drift)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint - ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff==0.17.1"

      - name: ruff check
        run: ruff check app tests scripts

  # ---------------------------------------------------------------------------
  # 3. SAST -- Bandit (Python static application security testing)
  # ---------------------------------------------------------------------------
  sast-bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Bandit
        run: pip install "bandit>=1.7.9"

      - name: Bandit scan (medium severity / medium confidence and up)
        run: |
          bandit -r app -ll -ii -f txt -o bandit-report.txt
          cat bandit-report.txt

      - name: Publish report to the job summary
        if: always()
        run: |
          {
            echo "## Bandit (SAST) result"
            echo ""
            echo '```text'
            cat bandit-report.txt 2>/dev/null || echo "bandit-report.txt not produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. SCA -- dependency vulnerability audit
  # ---------------------------------------------------------------------------
  sca-pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install "pip-audit>=2.7.3"

      - name: Audit pinned runtime dependencies
        run: |
          pip-audit -r requirements.txt --strict --desc --format=columns \
            | tee pip-audit-report.txt

      - name: Audit the installed environment as well
        continue-on-error: true
        run: pip-audit --desc --format=columns | tee pip-audit-env.txt

      - name: Publish report to the job summary
        if: always()
        run: |
          {
            echo "## pip-audit (SCA) result"
            echo ""
            echo '```text'
            cat pip-audit-report.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: |
            pip-audit-report.txt
            pip-audit-env.txt
          if-no-files-found: warn
