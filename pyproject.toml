[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Third-party DeprecationWarnings must not turn CI red on a new Python patch
# release; only the app's own warnings would be worth failing on, and those are
# caught by the code review anyway.

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
skip_empty = true
