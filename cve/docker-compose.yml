# Vulnerable environment: Nacos 1.4.0 with authentication enabled (CVE-2021-29441)
services:
  nacos:
    build:
      context: .
      args:
        NACOS_VERSION: "1.4.0"
    image: lab1-nacos-1.4.0-vulnerable
    container_name: lab1-cve-29441-vulnerable
    platform: linux/amd64
    ports:
      - "8848:8848"
    restart: "no"
