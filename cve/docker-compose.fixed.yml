# Patched environment: Nacos 1.4.1 with authentication enabled (CVE-2021-29441)
# Same image build, same configuration, same auth switch -- only NACOS_VERSION differs.
services:
  nacos:
    build:
      context: .
      dockerfile: Dockerfile.fixed
      args:
        NACOS_VERSION: "1.4.1"
    image: lab1-nacos-1.4.1-fixed
    container_name: lab1-cve-29441-fixed
    platform: linux/amd64
    ports:
      - "8848:8848"
    restart: "no"
